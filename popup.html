<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI Studio Exporter</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { width: 340px; }

    .pop { display: flex; flex-direction: column; gap: 16px; padding: 18px; }

    .pop-head { display: flex; justify-content: space-between; align-items: center; }
    .pop-head h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .icon-btn {
      display: inline-flex; padding: 4px; border: none; background: none;
      color: var(--dim); cursor: pointer; border-radius: var(--r-sm);
    }
    .icon-btn:hover { color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; display: block; }

    /* progress panel, only while an export is running */
    .progress { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r-lg); background: var(--accent-10); }
    .progress[hidden] { display: none; }
    .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .progress-stage { font-size: 12.5px; font-weight: 600; color: var(--accent-soft); }
    .progress-count { font-family: var(--mono); font-size: 11px; color: var(--accent-soft); white-space: nowrap; }
    .progress.is-warn { background: var(--warn-10); }
    .progress.is-warn .progress-stage, .progress.is-warn .progress-count { color: var(--warn-label); }

    /* format picker */
    .picker { display: flex; flex-direction: column; gap: 6px; }
    .picker-btn {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      width: 100%; padding: 10px 12px; background: var(--field);
      border: 1px solid var(--line); border-radius: var(--r-md);
      color: var(--text); font-family: var(--sans); font-size: 13px; cursor: pointer;
      text-align: left;
    }
    .picker-btn:hover:not(:disabled) { border-color: #3a3e48; }
    .picker-btn[aria-expanded='true'] { border-color: var(--accent); }
    .picker-btn:disabled { color: var(--dim); cursor: not-allowed; }
    .picker-btn svg { width: 12px; height: 12px; color: var(--dim); flex: 0 0 auto; }

    .picker-list {
      display: flex; flex-direction: column; padding: 6px 0;
      background: var(--raised); border: 1px solid var(--line);
      border-radius: var(--r-md); max-height: 260px; overflow-y: auto;
      /* The default scrollbar is light and lands in the middle of a dark
         panel, which is the only bright thing in the whole popup. */
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .picker-list[hidden] { display: none; }
    .picker-opt {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 7px 12px; font-size: 12.5px; color: var(--text-2); cursor: pointer;
      border: none; background: none; font-family: var(--sans); text-align: left; width: 100%;
    }
    .picker-opt:hover:not([aria-disabled='true']) { background: #1d1f24; }
    .picker-opt[aria-selected='true'] { background: rgba(79, 157, 250, 0.12); color: var(--accent-softer); }
    .picker-opt[aria-disabled='true'] { color: var(--disabled-ink); cursor: not-allowed; }
    .picker-opt:focus-visible { outline: none; background: #1d1f24; box-shadow: inset 2px 0 0 var(--accent); }

    .actions { display: flex; flex-direction: column; gap: 8px; }
    .actions .btn { width: 100%; padding: 12px; font-size: 13.5px; }
    .actions .btn-quiet { padding: 11px; }

    .spinner {
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid rgba(207, 228, 253, 0.35); border-top-color: var(--accent-softer);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.is-busy { background: var(--accent-22); color: var(--accent-softer); cursor: wait; }

    .pop-foot { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--dimmer); }
    .pop-foot a { color: var(--accent-soft); text-decoration: none; }
    .pop-foot a:hover { color: var(--accent-softer); }
    .pop-foot .tier { color: var(--accent-soft); }
  </style>
</head>

<body>
  <!-- Icons are inlined once and referenced with <use>: no network, no font,
       and the stroke colour follows currentColor like any other text. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.1 13.6a7.6 7.6 0 0 0 0-3.2l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.8-1.6L13.6 2h-3.2l-.4 2.9a7.6 7.6 0 0 0-2.8 1.6l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3.2l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.8 1.6l.4 2.9h3.2l.4-2.9a7.6 7.6 0 0 0 2.8-1.6l2.3 1 2-3.4z"></path>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5 2.8 19.5h18.4L12 3.5z"></path><path d="M12 9.5v4"></path><path d="M12 16.8h.01"></path>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5.2l3.2 2"></path>
      </symbol>
      <symbol id="i-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9.5 6 6 6-6"></path>
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12h15"></path><path d="m13.5 6 6 6-6 6"></path>
      </symbol>
    </defs>
  </svg>

  <div class="pop">
    <div class="pop-head">
      <h1>AI Studio Exporter</h1>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg><use href="#i-settings"></use></svg>
      </button>
    </div>

    <!-- Only rendered when something stops you exporting. A green "everything
         is fine" row is a row that is right 95% of the time and therefore
         never read. -->
    <div id="blocked" class="notice has-icon" hidden>
      <svg><use id="blockedIcon" href="#i-alert"></use></svg>
      <div class="notice-text">
        <span id="blockedTitle" class="notice-label"></span>
        <span id="blockedBody" class="notice-body"></span>
      </div>
    </div>

    <div id="progress" class="progress" hidden>
      <div class="progress-top">
        <span id="progressStage" class="progress-stage">Export in progress</span>
        <span id="progressCount" class="progress-count"></span>
      </div>
      <div id="progressBar" class="bar is-indeterminate"><span style="width:0%"></span></div>
    </div>

    <div class="picker">
      <span class="field-label" id="formatLabel">Export format</span>
      <button id="formatBtn" class="picker-btn" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-labelledby="formatLabel formatBtn">
        <span id="formatValue">Markdown</span>
        <svg><use href="#i-caret"></use></svg>
      </button>
      <div id="formatList" class="picker-list" role="listbox" aria-labelledby="formatLabel" hidden></div>
    </div>

    <div class="actions">
      <button id="exportBtn" class="btn btn-primary" disabled>
        <span id="btnText">Export this conversation</span>
      </button>
      <button id="exportLibraryBtn" class="btn btn-quiet" disabled>
        <span>Export entire library</span>
        <span id="libraryProBadge" class="chip" hidden>PRO</span>
      </button>
    </div>

    <div id="message" class="notice" hidden>
      <span id="messageLabel" class="notice-label"></span>
      <span id="messageBody" class="notice-body"></span>
      <button id="messageAction" class="notice-action" type="button" hidden>
        <span id="messageActionText"></span>
        <svg><use href="#i-arrow"></use></svg>
      </button>
    </div>

    <div class="pop-foot">
      <span id="versionLabel" class="mono"></span>
      <a id="upgradeLink" href="#" hidden>Unlock Pro</a>
      <span id="tierLabel" class="tier" hidden>Pro</span>
    </div>
  </div>

  <script src="settings.js"></script>
  <script src="src/badge.js"></script>
  <script src="pro/license.js"></script>
  <script src="popup.js"></script>
</body>

</html>
