<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Exporter</title>
  <style>
    :root {
      --bg-color: #1a1b1e;
      --card-bg: #25262b;
      --text-primary: #e9ecef;
      --text-secondary: #a5a5a5;
      --accent-color: #667eea;
      --border-color: #2c2e33;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
    }

    .container { padding: 18px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 17px;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: inline-flex;
      transition: all .16s ease;
    }
    .icon-btn:hover { color: #fff; background: rgba(102, 126, 234, .1); }
    .icon-btn svg { width: 19px; height: 19px; display: block; }

    .content {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }

    .status {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 9px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
    }
    .status.active { border-color: #2b8a3e; color: #69db7c; }
    .status.inactive { border-color: #c92a2a; color: #ff8787; }

    label.field { display: block; margin-bottom: 12px; }
    label.field span {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-color);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent-color); }

    button.action {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all .25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
    .primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102, 126, 234, .4); }

    .secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      margin-top: 8px;
    }
    .secondary:hover:not(:disabled) { border-color: var(--accent-color); color: #fff; }

    button.action:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    button.action.stop-mode { background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%); color: #fff; }

    .badge {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .05em;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(102, 126, 234, .18);
      color: #a5b4fc;
      border: 1px solid rgba(102, 126, 234, .35);
    }

    .message {
      margin-top: 11px;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      line-height: 1.45;
      display: none;
    }
    .message.success { background: rgba(43, 138, 62, .15); color: #69db7c; border: 1px solid rgba(43, 138, 62, .3); display: block; }
    .message.error { background: rgba(201, 42, 42, .15); color: #ff8787; border: 1px solid rgba(201, 42, 42, .3); display: block; }
    .message.info { background: rgba(102, 126, 234, .12); color: #a5b4fc; border: 1px solid rgba(102, 126, 234, .3); display: block; }
    .message.warn { background: rgba(178, 106, 0, .16); color: #ffc078; border: 1px solid rgba(178, 106, 0, .4); display: block; }

    .message .label {
      display: block;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .06em;
      opacity: .75;
      margin-bottom: 2px;
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center;
      margin-top: 13px;
      font-size: 10px;
      color: var(--text-secondary);
      opacity: .65;
    }
    .footer a { color: inherit; }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>AI Studio Exporter</h1>
      <div style="display:flex; align-items:center; gap:2px;">
        <a id="githubLink" class="icon-btn" href="https://github.com/Sukarth/AI-studio-exporter"
           target="_blank" rel="noopener noreferrer" title="View on GitHub" aria-label="View on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M12 .5C5.73.5.75 5.48.75 11.75c0 4.93 3.19 9.11 7.61 10.58.56.1.76-.24.76-.53 0-.26-.01-1.14-.02-2.07-3.09.67-3.74-1.49-3.74-1.49-.5-1.27-1.22-1.61-1.22-1.61-.99-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.67 2.57 1.19 3.2.91.1-.71.38-1.19.69-1.46-2.47-.28-5.06-1.24-5.06-5.52 0-1.22.44-2.22 1.16-3.01-.12-.28-.5-1.42.11-2.96 0 0 .95-.3 3.11 1.15a10.78 10.78 0 0 1 2.83-.38c.96 0 1.93.13 2.83.38 2.16-1.46 3.11-1.15 3.11-1.15.61 1.54.23 2.68.11 2.96.72.79 1.16 1.79 1.16 3.01 0 4.29-2.6 5.24-5.08 5.51.39.34.74 1.02.74 2.06 0 1.49-.01 2.69-.01 3.06 0 .29.2.64.77.53C19.06 20.86 22.25 16.68 22.25 11.75 22.25 5.48 17.27.5 12 .5z"/>
          </svg>
        </a>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="content">
      <div id="status" class="status inactive">
        <span class="status-icon">&#9888;</span>
        <span id="statusText">Not on AI Studio</span>
      </div>

      <label class="field" for="formatSelect">
        <span>Export format</span>
        <select id="formatSelect"></select>
      </label>

      <button id="exportBtn" class="action primary" disabled>
        <span id="btnText">Export Conversation</span>
      </button>

      <button id="exportLibraryBtn" class="action secondary" disabled>
        <span id="libraryBtnText">Export Entire Library</span>
        <span id="libraryProBadge" class="badge" hidden>PRO</span>
      </button>

      <div id="message" class="message"></div>
    </div>

    <div class="footer">
      <span id="versionLabel"></span> &middot; <a id="upgradeLink" href="#" hidden>Unlock Pro</a>
    </div>
  </div>

  <script src="settings.js"></script>
  <script src="src/badge.js"></script>
  <script src="pro/license.js"></script>
  <script src="popup.js"></script>
</body>

</html>
